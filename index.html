<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geode Mod Maker</title>

    <style id="1">
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: black;
        color: white;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 20px;
      }

      img {
        width: 50px;
        height: 50px;
      }

      .title {
        margin: 0;
        font-size: 2.5rem;
      }
    </style>

    <style id="2">
      @property --gradient-angle {
        syntax: "<angle>";
        initial-value: 0deg;
        inherits: false;
      }

      .t1-a1 {
        color: transparent;
        -webkit-background-clip: text;
        background-clip: text;

        background-image: linear-gradient(
          var(--gradient-angle),
          #f2e6b6, 
          #e8b2b5, 
          #8e82d8, 
          #a89ce8  
        );

        animation: rotate-gradient 10s linear infinite;
      }

      @keyframes rotate-gradient {
        to {
          --gradient-angle: 360deg;
        }
      }
    </style>
</head>
<body>
  <img src="https://uploads.onecompiler.io/44j39cf2p/1790601589465/geodemodmaker.png" alt="Geode Logo">
  
  <h1 class="title">
    <span class="t1-a1">Geode</span> Mod Maker
  </h1>
</body>
